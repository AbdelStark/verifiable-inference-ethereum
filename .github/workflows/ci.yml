name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust primitives & vector sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Print toolchain versions
        run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests (TinyLlama 23-segment grid + Rust rows of the SPEC.md §2.1 negative-control table)
        run: cargo test --locked --workspace
      - name: Check TinyLlamaFixture.sol is byte-identical to the Rust export
        run: |
          tmp="$(mktemp)"
          cargo run --locked --quiet -p sash-evm-primitives --bin export_vectors -- "$tmp"
          cmp -s "$tmp" contracts/src/sash/TinyLlamaFixture.sol || { echo "::error file=contracts/src/sash/TinyLlamaFixture.sol::TinyLlamaFixture.sol drift detected; run 'make vectors'"; exit 1; }
          rm -f "$tmp"

  solidity:
    name: Foundry Solidity verifier & gas gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - name: Print toolchain versions
        working-directory: contracts
        run: |
          forge --version
          forge compiler resolve
      - name: Format check
        working-directory: contracts
        run: forge fmt --check
      - name: Compile against foundry.lock & check EIP-170 code size (< 24,576 B)
        working-directory: contracts
        run: forge build --locked --sizes
      - name: Lint
        working-directory: contracts
        run: forge lint --deny warnings
      - name: Run TinyLlama 23-segment settlement, gas snapshots & Foundry rows of the SPEC.md §2.1 negative-control table
        working-directory: contracts
        shell: bash
        run: |
          rm -rf snapshots
          forge test -vvv --gas-report | tee "$RUNNER_TEMP/gas-report.txt"
      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gas-report
          path: ${{ runner.temp }}/gas-report.txt
      - name: Check gas snapshots match the commit
        working-directory: contracts
        run: |
          git diff --exit-code -- snapshots || { echo "::error::Gas snapshots differ from the commit"; exit 1; }
          untracked="$(git ls-files --others --exclude-standard -- snapshots)"
          test -z "$untracked" || { echo "::error::Untracked gas snapshots: $untracked"; exit 1; }
      - name: Mine the TinyLlama dev-mode settlement on a local Osaka anvil node and check the receipts
        working-directory: contracts
        run: script/anvil-settle.sh

  sp1:
    name: SP1 guest workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install protoc (sp1-sdk build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install SP1 v6.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sp1up" https://raw.githubusercontent.com/succinctlabs/sp1/v6.10.0/sp1up/sp1up
          bash "$RUNNER_TEMP/sp1up" --version v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Print toolchain versions
        run: |
          "$HOME/.sp1/bin/cargo-prove" prove --version
          rustc +succinct --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sp1 -> target
      - name: Format check
        working-directory: sp1
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: sp1
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Executor tests (token-hash guest, SPEC.md §1.1 rule 1)
        working-directory: sp1
        run: cargo test --locked --workspace
      - name: Reproducible guest build in the pinned SP1 Docker image
        working-directory: sp1/segment-guest
        run: |
          cargo prove build --docker --tag v6.10.0 --locked --workspace-directory ../..
          shasum -a 256 ../target/elf-compilation/docker/riscv64im-succinct-zkvm-elf/release/segment-guest
