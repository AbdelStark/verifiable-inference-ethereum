name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust primitives & vector sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Print toolchain versions
        run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests (Stwo + TinyLlama 23-segment + negative controls 1 to 16)
        run: cargo test --locked --workspace
      - name: Check TinyLlamaFixture.sol is byte-identical to the Rust export
        run: |
          tmp="$(mktemp)"
          cargo run --locked --quiet -p sash-evm-primitives --bin export_vectors -- "$tmp"
          cmp -s "$tmp" contracts/src/sash/TinyLlamaFixture.sol || { echo "::error file=contracts/src/sash/TinyLlamaFixture.sol::TinyLlamaFixture.sol drift detected; run 'make vectors'"; exit 1; }
          rm -f "$tmp"

  solidity:
    name: Foundry Solidity verifier & gas gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - name: Print toolchain versions
        working-directory: contracts
        run: |
          forge --version
          forge compiler resolve
      - name: Format check
        working-directory: contracts
        run: forge fmt --check
      - name: Compile against foundry.lock & check EIP-170 code size (< 24,576 B)
        working-directory: contracts
        run: forge build --locked --sizes
      - name: Lint
        working-directory: contracts
        run: forge lint --deny warnings
      - name: Run unit, TinyLlama 23-segment settlement & 20 negative-control tests
        working-directory: contracts
        run: forge test -vvv --gas-report
      - name: Dry-run local Anvil settlement script
        working-directory: contracts
        run: forge script script/DeployDevAnvil.s.sol:DeployDevAnvil -vvvv
