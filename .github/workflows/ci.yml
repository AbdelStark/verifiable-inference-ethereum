name: CI

# Pushes to main, the weekly schedule and a manual run (workflow_dispatch, on any branch) run every
# job, and the sash job in full: they never restore the synthetic corpus cache, and they save it for PRs. A PR runs sash and the SP1 jobs only when it
# changes what they build or run (the changes job); otherwise they report "skipped", which satisfies
# a required check. On a PR, the changes job looks up sp1/scripts/corpus-key.sh's key, a hash of every
# file the corpus and the built oracle come from, in the cache (entries saved on main, or by an earlier
# run of the same PR). On a hit, sash checks the restored corpus without rebuilding upstream SASH, and
# sp1-cached runs the executor suite on it without waiting for sash; on a miss, sash runs in full and
# sp1 takes its artifact. sp1-bundles runs the segment guest on the published TinyLlama bundles with
# sp1-workspace's Docker-built ELFs: three segments on a PR, all 23, the fixture check and the
# aggregator guest on their public values otherwise; and, on every event, the aggregator over the 23
# published segment proofs (sp1/scripts/tinyllama-proofs.sh), the guard against vkey drift.
on:
  push:
    branches: [main]
  pull_request:
  # Runs a branch's main path before merge: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:
  schedule:
    # Mondays 05:17 UTC: drift the corpus key cannot see (runner image, NVIDIA's apt repository).
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  # What the corpus cache holds: the corpus and the oracle that checks it (it links the CUDA runtime).
  # Restore, lookup and save must name the same paths.
  CORPUS_CACHE_PATHS: |
    sp1/testdata/synthetic
    sp1/target/sash/release/sash-oracle

jobs:
  changes:
    name: Paths that gate the SASH and SP1 jobs, and the corpus cache lookup
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.lookup.outputs.cache-hit == 'true' }}
    steps:
      # Depth 2: a PR checks out its merge commit, whose first parent is the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does the change reach sp1/ or what it builds from?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            heavy=true
          else
            # --no-renames: a file moved out of a gated path lists its old path too. -z: NUL-terminated
            # paths, never quoted (git quotes a path with a special or, by default, non-ASCII byte, and a
            # quoted path starts with `"`, which no pattern below matches).
            changed="$RUNNER_TEMP/changed"
            git -c core.quotePath=false diff --no-renames --name-only -z HEAD^1 HEAD >"$changed"
            tr '\0' '\n' <"$changed"
            # sp1/ inherits the root Cargo.toml's workspace fields through sash-evm-primitives, and its toolchain.
            # sp1-workspace's tests read contracts/fixtures/ (the PLONK fixture).
            if grep -qzE '^(sp1/|crates/sash-evm-primitives/|contracts/fixtures/|Cargo\.toml$|rust-toolchain\.toml$|Makefile$|\.github/workflows/ci\.yml$)' "$changed"; then
              heavy=true
            else
              heavy=false
            fi
          fi
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"
      - name: Corpus cache key (a hash of every file the corpus and the oracle are built from)
        id: key
        if: steps.gate.outputs.heavy == 'true'
        run: echo "key=sash-corpus-$(sp1/scripts/corpus-key.sh)" | tee -a "$GITHUB_OUTPUT"
      # PRs only: pushes to main and the scheduled run always regenerate the corpus. A hit sends the
      # executor suite to sp1-cached, which doesn't wait for the sash job.
      - name: Is there a saved corpus for this key? (PRs only)
        id: lookup
        if: steps.gate.outputs.heavy == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE_PATHS }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

  rust:
    name: Rust primitives & vector sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Print toolchain versions
        run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests (TinyLlama 23-segment grid + Rust rows of the SPEC.md §2.1 negative-control table)
        run: cargo test --locked --workspace
      - name: Check TinyLlamaFixture.sol is byte-identical to the Rust export
        run: |
          tmp="$(mktemp)"
          cargo run --locked --quiet -p sash-evm-primitives --bin export_vectors -- "$tmp"
          cmp -s "$tmp" contracts/src/sash/TinyLlamaFixture.sol || { echo "::error file=contracts/src/sash/TinyLlamaFixture.sol::TinyLlamaFixture.sol drift detected; run 'make vectors'"; exit 1; }
          rm -f "$tmp"

  solidity:
    name: Foundry Solidity verifier & gas gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - name: Print toolchain versions
        working-directory: contracts
        run: |
          forge --version
          forge compiler resolve
      - name: Format check
        working-directory: contracts
        run: forge fmt --check
      - name: Compile against foundry.lock & check EIP-170 code size (< 24,576 B)
        working-directory: contracts
        run: forge build --locked --sizes
      - name: Lint
        working-directory: contracts
        run: forge lint --deny warnings
      - name: Run TinyLlama 23-segment settlement, gas snapshots & Foundry rows of the SPEC.md §2.1 negative-control table
        working-directory: contracts
        shell: bash
        run: |
          rm -rf snapshots
          forge test -vvv --gas-report | tee "$RUNNER_TEMP/gas-report.txt"
      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gas-report
          path: ${{ runner.temp }}/gas-report.txt
      - name: Check gas snapshots match the commit
        working-directory: contracts
        run: |
          git diff --exit-code -- snapshots || { echo "::error::Gas snapshots differ from the commit"; exit 1; }
          untracked="$(git ls-files --others --exclude-standard -- snapshots)"
          test -z "$untracked" || { echo "::error::Untracked gas snapshots: $untracked"; exit 1; }
      - name: Mine the TinyLlama dev-mode settlement on a local Osaka anvil node and check the receipts
        working-directory: contracts
        run: script/anvil-settle.sh

  sp1-workspace:
    name: SP1 workspace & reproducible guest builds
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install protoc (sp1-sdk build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install SP1 v6.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sp1up" https://raw.githubusercontent.com/succinctlabs/sp1/v6.10.0/sp1up/sp1up
          bash "$RUNNER_TEMP/sp1up" --version v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Print toolchain versions
        run: |
          "$HOME/.sp1/bin/cargo-prove" prove --version
          rustc +succinct --version
      # One cache for the three SP1 jobs, saved by this one: it builds the debug and the release sp1-host.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sp1 -> target
          shared-key: sp1
      # Before any cargo command in sp1/: its path dependencies on SASH don't exist until it runs.
      - name: Vendor SASH eb95bfa (sha256-pinned tarball plus sp1/patches)
        run: sp1/scripts/vendor-sash.sh
      - name: Check nitroo's Stwo without the prover feature on stable (no CUDA)
        working-directory: sp1/vendor/sash/nitroo
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/sp1/target/nitroo-check
        run: |
          cargo +1.99.1 check --locked --no-default-features --features std -p stwo
          cargo +1.99.1 check --locked --no-default-features --features std,count-ops -p stwo
          cargo +1.99.1 check --locked --no-default-features --features std -p stwo-constraint-framework
      - name: Check SASH's zk-prover library (verify_composed) without the prover feature on stable
        working-directory: sp1/vendor/sash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/sp1/target/nitroo-check
        run: cargo +1.99.1 check --locked -p zk-prover --no-default-features --lib
      - name: Format check
        working-directory: sp1
        run: cargo fmt -- --check
      # Tests before clippy: they build the guest ELF, which sp1-build skips under clippy but `include_elf!` needs.
      - name: The segment check's and the aggregator's unit tests, and the aggregator and echo guests in the executor (the segment guest's executor suite, which needs the corpus, runs in sp1 or sp1-cached)
        working-directory: sp1
        run: cargo test --locked --workspace
      - name: stwo-bench in the profiling executor (cycle-tracker regions) and the BLAKE2s compression counter
        working-directory: sp1
        run: cargo test --locked -p sp1-host --features profiling,count-ops
      - name: Clippy
        working-directory: sp1
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p sp1-host --all-targets --features profiling,count-ops -- -D warnings
      - name: Reproducible guest builds in the SP1 image pinned by digest; ELF sha256 and vkey against the committed ones
        run: sp1/scripts/docker-guests.sh
      - name: Upload the Docker-built segment guest ELF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segment-guest-elf
          path: sp1/target/elf-compilation/docker/riscv64im-succinct-zkvm-elf/release/segment-guest
          retention-days: 30
          if-no-files-found: warn
      - name: Upload the Docker-built aggregator guest ELF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aggregator-guest-elf
          path: sp1/target/elf-compilation/docker/riscv64im-succinct-zkvm-elf/release/aggregator-guest
          retention-days: 30
          if-no-files-found: warn

  # The segment guest's executor suite on the corpus, in one of two jobs with the same steps: sp1-cached
  # on a corpus cache hit (restores it, without waiting for the sash job), sp1 otherwise (takes the
  # sash job's artifact). The other one reports "skipped".
  sp1-cached:
    name: SP1 segment guest executor suite on the cached synthetic corpus
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.hit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: &sp1-suite
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install protoc (sp1-sdk build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install SP1 v6.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sp1up" https://raw.githubusercontent.com/succinctlabs/sp1/v6.10.0/sp1up/sp1up
          bash "$RUNNER_TEMP/sp1up" --version v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Print toolchain versions
        run: |
          "$HOME/.sp1/bin/cargo-prove" prove --version
          rustc +succinct --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sp1 -> target
          shared-key: sp1
          save-if: false
      - name: Vendor SASH eb95bfa (sha256-pinned tarball plus sp1/patches)
        run: sp1/scripts/vendor-sash.sh
      # Fails rather than falls back if the entry the changes job found has since been evicted.
      - name: Restore the synthetic corpus from the cache
        if: needs.changes.outputs.hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE_PATHS }}
          key: ${{ needs.changes.outputs.key }}
          fail-on-cache-miss: true
      - name: Download the sash job's synthetic corpus
        if: needs.changes.outputs.hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sash-synthetic-corpus
          path: ${{ runner.temp }}/sash-synthetic-corpus
      - name: Move the downloaded corpus into sp1/testdata/synthetic
        if: needs.changes.outputs.hit != 'true'
        run: mv "$RUNNER_TEMP/sash-synthetic-corpus/synthetic" sp1/testdata/synthetic
      - name: Check the corpus against sp1/testdata/synthetic.sha256
        working-directory: sp1/testdata/synthetic
        run: sha256sum --strict -c ../synthetic.sha256
      # Release: a debug executor is too slow for ~1.5e9-cycle runs. One thread: the native executor keeps guest
      # memory in /dev/shm (~5 GB per run), and two concurrent runs overflow the runner's /dev/shm (SIGBUS).
      - name: Segment guest in the executor on every corpus bundle and bundle mutation (SPEC.md §2.1 G1-G7, G9, G10)
        working-directory: sp1
        env:
          SASH_SYNTHETIC_CORPUS: ${{ github.workspace }}/sp1/testdata/synthetic
        run: cargo test --release --locked -p sp1-host --test segment_guest -- --ignored --test-threads=1
      - name: sp1-host fixture-from-bundles renders the committed TinyLlamaFixture.sol from the 23 TinyLlama public values and a corpus statement carrying the TinyLlama tokens
        working-directory: sp1
        env:
          SASH_SYNTHETIC_CORPUS: ${{ github.workspace }}/sp1/testdata/synthetic
        run: cargo test --release --locked -p sp1-host --test fixture -- --ignored

  sp1:
    name: SP1 segment guest executor suite on the sash job's synthetic corpus
    needs: [changes, sash]
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: *sp1-suite

  # The segment guest on the published TinyLlama bundles (sp1/scripts/tinyllama-bundles.sh), with the
  # Docker-built ELF from sp1-workspace in this run. A PR runs B0L0, B0L10 and head and the controls,
  # which use only those three; pushes to main, the schedule and a manual run take the main path: all
  # 23, the controls, the fixture byte-identity check and the Docker-built aggregator guest on the 23
  # public values. On every event, it also downloads the 23 published segment proofs
  # (sp1/scripts/tinyllama-proofs.sh) and runs the Docker-built aggregator over them with --execute-only:
  # a guest-linked change that moves either guest's pins fails there. One segment execution at a time:
  # the native executor keeps guest memory in /dev/shm.
  sp1-bundles:
    name: SP1 segment guest on the published TinyLlama bundles
    needs: [changes, sp1-workspace]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 240 }}
    env:
      BUNDLES: ${{ github.workspace }}/runs/tinyllama
      PROOFS: ${{ github.workspace }}/runs/tinyllama-proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install protoc (sp1-sdk build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install SP1 v6.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sp1up" https://raw.githubusercontent.com/succinctlabs/sp1/v6.10.0/sp1up/sp1up
          bash "$RUNNER_TEMP/sp1up" --version v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Print toolchain versions
        run: |
          "$HOME/.sp1/bin/cargo-prove" prove --version
          rustc +succinct --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sp1 -> target
          shared-key: sp1
          save-if: false
      - name: Vendor SASH eb95bfa (sha256-pinned tarball plus sp1/patches)
        run: sp1/scripts/vendor-sash.sh
      - name: Restore the TinyLlama bundles (keyed by sp1/pins/tinyllama.sha256)
        id: bundles
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/tinyllama
          key: tinyllama-bundles-${{ hashFiles('sp1/pins/tinyllama.sha256') }}
      # Anonymous: the dataset is public. Keeps restored files with their pinned sha256, downloads the
      # rest at the pinned dataset commit, and fails unless runs/tinyllama holds exactly the 69 pinned files.
      - name: Download the TinyLlama bundles from their public Hugging Face dataset and check them against sp1/pins/tinyllama.sha256
        run: sp1/scripts/tinyllama-bundles.sh "$BUNDLES"
      # main only (pushes and the schedule): PRs restore main's entry, so no PR stores its own 738 MB copy.
      - name: Save the TinyLlama bundles (main)
        if: steps.bundles.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/tinyllama
          key: tinyllama-bundles-${{ hashFiles('sp1/pins/tinyllama.sha256') }}
      - name: Restore the TinyLlama proofs (keyed by sp1/pins/tinyllama.proofs.sha256)
        id: proofs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/tinyllama-proofs
          key: tinyllama-proofs-${{ hashFiles('sp1/pins/tinyllama.proofs.sha256') }}
      # Anonymous: the dataset is public. Keeps restored files with their pinned sha256, downloads the rest
      # at the pinned dataset commit, and fails unless runs/tinyllama-proofs holds exactly the 24 pinned files.
      - name: Download the 23 TinyLlama segment proofs and the PLONK proof from their public Hugging Face dataset and check them against sp1/pins/tinyllama.proofs.sha256
        run: sp1/scripts/tinyllama-proofs.sh "$PROOFS"
      - name: Save the TinyLlama proofs (main)
        if: steps.proofs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/tinyllama-proofs
          key: tinyllama-proofs-${{ hashFiles('sp1/pins/tinyllama.proofs.sha256') }}
      # The native executor keeps guest memory in /dev/shm, a tmpfs of half the runner's 16 GB by default;
      # head's run comes close to that (docs/EVM-GAS-MODEL.md §7), and a full /dev/shm is a SIGBUS.
      - name: Enlarge /dev/shm for head's guest memory
        run: |
          sudo mount -o remount,size=12G /dev/shm
          df -h /dev/shm && free -h
      # sp1-execute.sh and sp1-fixture-check.sh check it against sp1/segment-guest.elf.sha256 and sp1/segment-guest.vkey.
      - name: Download sp1-workspace's Docker-built segment guest ELF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: segment-guest-elf
          path: ${{ runner.temp }}/segment-guest-elf
      # sp1-fixture-check.sh and sp1-proofs-check.sh check it against sp1/aggregator-guest.elf.sha256 and sp1/aggregator-guest.vkey.
      - name: Download sp1-workspace's Docker-built aggregator guest ELF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aggregator-guest-elf
          path: ${{ runner.temp }}/aggregator-guest-elf
      - name: The aggregator over the 23 published segment proofs, --execute-only, with the Docker-built ELFs (pins, SEGMENT_VKEY, each proof verified with its expected public values, SPEC.md §1.4's publicDigest, the executor with the proofs in stdin)
        env:
          ELF: ${{ runner.temp }}/segment-guest-elf/segment-guest
          AGGREGATOR_ELF: ${{ runner.temp }}/aggregator-guest-elf/aggregator-guest
        run: sp1/scripts/sp1-proofs-check.sh
      - name: Segment guest in the executor on B0L0, B0L10 and head, against native check_segment and the fixedHash pins, and the real-bundle controls (SPEC.md §2.1 G2, G7, G9, G10) (PRs)
        if: github.event_name == 'pull_request'
        env:
          ELF: ${{ runner.temp }}/segment-guest-elf/segment-guest
          OUT: ${{ runner.temp }}/sp1-execute
          SEGMENTS: B0L0 B0L10 head
        run: sp1/scripts/sp1-execute.sh
      - name: Segment guest in the executor on all 23 segments, against native check_segment and the fixedHash pins, and the real-bundle controls (SPEC.md §2.1 G2, G7, G9, G10) (main, schedule, manual)
        if: github.event_name != 'pull_request'
        env:
          ELF: ${{ runner.temp }}/segment-guest-elf/segment-guest
          OUT: ${{ runner.temp }}/sp1-execute
        run: sp1/scripts/sp1-execute.sh
      - name: TinyLlamaFixture.sol rendered from the 23 segments' executor public values is byte-identical to the committed one, and the aggregator guest commits SPEC.md §1.4's publicDigest on them (main, schedule, manual)
        if: github.event_name != 'pull_request'
        env:
          ELF: ${{ runner.temp }}/segment-guest-elf/segment-guest
          AGGREGATOR_ELF: ${{ runner.temp }}/aggregator-guest-elf/aggregator-guest
        run: sp1/scripts/sp1-fixture-check.sh

  sash:
    name: Upstream SASH prover & synthetic corpus
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # As upstream's own CI (sp1/vendor/sash/.github/workflows/ci.yml): no GPU is needed to build the
      # SIMD backend or prove the synthetic segments, only nvcc and the CUDA libraries the fork links.
      CUDAARCHS: "90"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PRs only: pushes to main and the scheduled run always regenerate the corpus. Its own restore, not
      # the changes job's lookup, picks the path below, so an entry evicted meanwhile means a full run.
      - name: Restore the corpus and the oracle (PRs only)
        id: corpus
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE_PATHS }}
          key: ${{ needs.changes.outputs.key }}
      - name: CUDA 12.9 toolkit (no GPU)
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-9 cuda-cudart-dev-12-9 libcurand-dev-12-9 cuda-cccl-12-9 cuda-driver-dev-12-9
          # nitroo's build.rs names /usr/local/cuda/lib64 literally.
          sudo ln -sfn /usr/local/cuda-12.9 /usr/local/cuda
          echo /usr/local/cuda/lib64 | sudo tee /etc/ld.so.conf.d/cuda.conf
          sudo ldconfig
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
      - name: Vendor SASH and install its Rust toolchain and the repository's (from their rust-toolchain.toml)
        run: |
          rustup toolchain install
          sp1/scripts/vendor-sash.sh
          cd sp1/vendor/sash && rustup toolchain install --profile minimal
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Only the downloaded crates: sccache covers the compiling.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sash-cargo-registry-${{ hashFiles('sp1/sash-oracle/Cargo.lock', 'sp1/Cargo.lock', 'sp1/patches/*.patch') }}
          restore-keys: sash-cargo-registry-
      - name: Disk before
        run: df -h /
      - name: Build SASH, check its pinned digests, regenerate the synthetic corpus, check the records, and run the segment check's bundle and differential tests
        if: steps.corpus.outputs.cache-hit != 'true'
        run: sp1/scripts/sash-synthetic.sh
      # A hit skips only what needs the prover build: upstream's test suite and the corpus generation.
      - name: On a cache hit, without rebuilding, check the restored corpus with the restored oracle against the records, and run the segment check's bundle and differential tests
        if: steps.corpus.outputs.cache-hit == 'true'
        run: sp1/scripts/sash-corpus-check.sh
      # On every event that regenerated the corpus: main's entry serves every PR, a PR's own its later runs.
      - name: Save the corpus and the oracle
        if: steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_CACHE_PATHS }}
          key: ${{ needs.changes.outputs.key }}
      - name: Disk after
        if: always()
        run: df -h / && sccache --show-stats
      - name: Upload the synthetic corpus and its records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sash-synthetic-corpus
          path: sp1/testdata/
          retention-days: 14
          if-no-files-found: warn
