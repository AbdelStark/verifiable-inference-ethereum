name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust primitives, repacker & vector sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (Stwo + TinyLlama 23-segment + 20 negative controls)
        run: cargo test --workspace
      - name: Check Foundry test vectors are byte-identical to Rust reference
        run: |
          tmp="$(mktemp)"
          cargo run --quiet -p sash-evm-primitives --bin export_vectors -- "$tmp"
          cmp -s "$tmp" contracts/test/vectors/tinyllama_23seg_fixture.json
          rm -f "$tmp"

  solidity:
    name: Foundry Solidity verifier & gas gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Compile contracts & check EIP-170 code size (< 24,576 B)
        working-directory: contracts
        run: forge build --sizes
      - name: Run unit, TinyLlama 23-segment settlement & 20 negative-control tests
        working-directory: contracts
        run: forge test -vvv --gas-report
      - name: Dry-run local Anvil settlement script
        working-directory: contracts
        run: forge script script/DeployDevAnvil.s.sol:DeployDevAnvil -vvvv
