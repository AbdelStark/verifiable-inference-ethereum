name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust primitives & vector sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Print toolchain versions
        run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests (TinyLlama 23-segment grid + Rust rows of the SPEC.md §2.1 negative-control table)
        run: cargo test --locked --workspace
      - name: Check TinyLlamaFixture.sol is byte-identical to the Rust export
        run: |
          tmp="$(mktemp)"
          cargo run --locked --quiet -p sash-evm-primitives --bin export_vectors -- "$tmp"
          cmp -s "$tmp" contracts/src/sash/TinyLlamaFixture.sol || { echo "::error file=contracts/src/sash/TinyLlamaFixture.sol::TinyLlamaFixture.sol drift detected; run 'make vectors'"; exit 1; }
          rm -f "$tmp"

  solidity:
    name: Foundry Solidity verifier & gas gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - name: Print toolchain versions
        working-directory: contracts
        run: |
          forge --version
          forge compiler resolve
      - name: Format check
        working-directory: contracts
        run: forge fmt --check
      - name: Compile against foundry.lock & check EIP-170 code size (< 24,576 B)
        working-directory: contracts
        run: forge build --locked --sizes
      - name: Lint
        working-directory: contracts
        run: forge lint --deny warnings
      - name: Run TinyLlama 23-segment settlement, gas snapshots & Foundry rows of the SPEC.md §2.1 negative-control table
        working-directory: contracts
        shell: bash
        run: |
          rm -rf snapshots
          forge test -vvv --gas-report | tee "$RUNNER_TEMP/gas-report.txt"
      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gas-report
          path: ${{ runner.temp }}/gas-report.txt
      - name: Check gas snapshots match the commit
        working-directory: contracts
        run: |
          git diff --exit-code -- snapshots || { echo "::error::Gas snapshots differ from the commit"; exit 1; }
          untracked="$(git ls-files --others --exclude-standard -- snapshots)"
          test -z "$untracked" || { echo "::error::Untracked gas snapshots: $untracked"; exit 1; }
      - name: Mine the TinyLlama dev-mode settlement on a local Osaka anvil node and check the receipts
        working-directory: contracts
        run: script/anvil-settle.sh

  sp1:
    name: SP1 guest workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install protoc (sp1-sdk build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install SP1 v6.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sp1up" https://raw.githubusercontent.com/succinctlabs/sp1/v6.10.0/sp1up/sp1up
          bash "$RUNNER_TEMP/sp1up" --version v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Print toolchain versions
        run: |
          "$HOME/.sp1/bin/cargo-prove" prove --version
          rustc +succinct --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sp1 -> target
      # Before any cargo command in sp1/: its path dependencies on SASH don't exist until it runs.
      - name: Vendor SASH eb95bfa (sha256-pinned tarball plus sp1/patches)
        run: sp1/scripts/vendor-sash.sh
      - name: Check nitroo's Stwo without the prover feature on stable (no CUDA)
        working-directory: sp1/vendor/sash/nitroo
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/sp1/target/nitroo-check
        run: |
          cargo +1.99.1 check --locked --no-default-features --features std -p stwo
          cargo +1.99.1 check --locked --no-default-features --features std -p stwo-constraint-framework
      - name: Check SASH's zk-prover library (verify_composed) without the prover feature on stable
        working-directory: sp1/vendor/sash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/sp1/target/nitroo-check
        run: cargo +1.99.1 check --locked -p zk-prover --no-default-features --lib
      - name: Format check
        working-directory: sp1
        run: cargo fmt -- --check
      # Tests before clippy: they build the guest ELF, which sp1-build skips under clippy but `include_elf!` needs.
      - name: Executor tests (token-hash guest, SPEC.md §1.1 rule 1)
        working-directory: sp1
        run: cargo test --locked --workspace
      - name: stwo-bench in the profiling executor (cycle-tracker regions)
        working-directory: sp1
        run: cargo test --locked -p sp1-host --features profiling
      - name: Clippy
        working-directory: sp1
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Reproducible guest builds in the pinned SP1 Docker image
        run: |
          (cd sp1/segment-guest && cargo prove build --docker --tag v6.10.0 --locked --workspace-directory ../..)
          (cd sp1/stwo-bench && cargo prove build --docker --tag v6.10.0 --locked --workspace-directory ../..)
          shasum -a 256 sp1/target/elf-compilation/docker/riscv64im-succinct-zkvm-elf/release/segment-guest sp1/target/elf-compilation/docker/riscv64im-succinct-zkvm-elf/release/stwo-bench

  sash:
    name: Upstream SASH prover & synthetic corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # As upstream's own CI (sp1/vendor/sash/.github/workflows/ci.yml): no GPU is needed to build the
      # SIMD backend or prove the synthetic segments, only nvcc and the CUDA libraries the fork links.
      CUDAARCHS: "90"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CUDA 12.9 toolkit (no GPU)
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-9 cuda-cudart-dev-12-9 libcurand-dev-12-9 cuda-cccl-12-9 cuda-driver-dev-12-9
          # nitroo's build.rs names /usr/local/cuda/lib64 literally.
          sudo ln -sfn /usr/local/cuda-12.9 /usr/local/cuda
          echo /usr/local/cuda/lib64 | sudo tee /etc/ld.so.conf.d/cuda.conf
          sudo ldconfig
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
      - name: SASH's Rust toolchain
        run: rustup toolchain install nightly-2025-07-14 --profile minimal
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Only the downloaded crates: sccache covers the compiling. Never the corpus or the oracle binary.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sash-cargo-registry-${{ hashFiles('sp1/sash-oracle/Cargo.lock', 'sp1/patches/*.patch') }}
          restore-keys: sash-cargo-registry-
      - name: Disk before
        run: df -h /
      - name: Build SASH, check its pinned digests, regenerate the synthetic corpus and check the records
        run: sp1/scripts/sash-synthetic.sh
      - name: One-time evidence for #40 (temporary, removed before merge)
        run: sp1/scripts/evidence-gkr-move.sh
      - name: Disk after
        if: always()
        run: df -h / && sccache --show-stats
      - name: Upload the synthetic corpus and its records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sash-synthetic-corpus
          path: sp1/testdata/
          retention-days: 14
          if-no-files-found: warn
