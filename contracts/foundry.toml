[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "osaka"
# `chain_id` stays unset, so that forks and scripts see the chain's real id; forge's default is 31337.
optimizer = true
optimizer_runs = 200
via_ir = true
# `new` must be a real CREATE: as a deployCode cheatcode, an expected constructor revert ends the whole test.
dynamic_test_linking = false
# The project's EIP-170 limit (AGENTS.md §2.5), also enforced on test and script deployments.
code_size_limit = 24576
# Each test function's total gas, every call counted, stays within the EIP-7825 cap of 2^24.
gas_limit = 16777216
# Each top-level state-changing call runs as its own transaction, so its gas includes intrinsic and
# calldata gas and matches an anvil receipt; view and pure calls aren't isolated.
isolate = true
# The tests and DeployAnvilSp1.s.sol read the committed PLONK proof, contracts/fixtures/tinyllama.plonk.json, and
# the fork tests the SP1 deployment addresses; `out` is Foundry's default, which `deployCode` reads, and a set
# `fs_permissions` replaces it.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./fixtures" },
    { access = "read", path = "./lib/sp1-contracts/contracts/deployments" },
]

[fuzz]
# Fixed so the single-field mutation fuzz test (`SPEC.md` §2.1, row F) replays the same cases.
seed = "0x1"

[fmt]
# Generated by `make vectors`; `make check` compares it byte for byte with the Rust export.
ignore = ["src/sash/TinyLlamaFixture.sol"]
