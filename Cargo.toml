[workspace]
resolver = "2"
members = [
    "crates/sash-evm-primitives",
    "crates/sash-repack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Abdel <@AbdelStark>"]

[workspace.dependencies]
blake2 = "0.10.6"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sash-evm-primitives = { path = "crates/sash-evm-primitives" }
