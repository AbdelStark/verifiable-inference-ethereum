# Upstream SASH's verifier with only the patches that change behaviour (sp1/vendor/sash-oracle,
# SPEC.md §1.1: patch 0006), default features, prover included, as the reference for the guest's
# differential tests: it never sees the verifier extraction (patches 0001-0005), whose verdict those
# tests check is preserved. Its own workspace: it builds on SASH's nightly toolchain and links the CUDA
# runtime, which the sp1/ workspace must not.
[workspace]

[package]
name = "sash-oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Prints upstream SASH verify_composed's verdict and binding table for one bundle as JSON"

[dependencies]
serde_json = "1"
sha2 = "0.10"
zk-prover = { path = "../vendor/sash-oracle/prover" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
