# SP1 programs and their host. A workspace of its own, with its own lockfile: guests build for
# riscv64im-succinct-zkvm-elf with SP1's `succinct` toolchain, not the root workspace's.
[workspace]
resolver = "3"
members = [
    "aggregator-guest",
    "echo-guest",
    "sash-aggregate",
    "sash-segment-check",
    "segment-guest",
    "sp1-host",
    "stwo-bench",
]
# SASH at the pinned commit plus sp1/patches, built by scripts/vendor-sash.sh. SASH and nitroo are
# workspaces of their own; the root Cargo.toml excludes the tree too (see there). sash-oracle is its own
# workspace on SASH's nightly toolchain.
exclude = ["vendor", "sash-oracle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Abdel <@AbdelStark>"]
publish = false

[workspace.dependencies]
sash-aggregate = { path = "sash-aggregate" }
sash-evm-primitives = { path = "../crates/sash-evm-primitives" }
sash-segment-check = { path = "sash-segment-check" }
sp1-build = "=6.10.0"
sp1-sdk = { version = "=6.10.0", features = ["blocking"] }
sp1-zkvm = "=6.10.0"
# nitroo's Stwo from the vendored SASH tree, without its `prover` feature (SPEC.md §1.1).
stwo = { path = "vendor/sash/nitroo/crates/stwo", default-features = false, features = ["std"] }
# SASH's zk-prover without its `prover` feature: verify_composed and what it calls (SPEC.md §1.1).
zk-prover = { path = "vendor/sash/prover", default-features = false }
# stwo-bench's BLAKE2s compression (the version SASH locks) and its three proof encodings (#38).
blake2 = { version = "=0.10.6", default-features = false }
bincode = "=1.3.3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"

# SP1's sha256 precompile, for the segment guest's token hashes and the aggregator's digests (the tag
# SP1 v6.10.0 tests against).
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
