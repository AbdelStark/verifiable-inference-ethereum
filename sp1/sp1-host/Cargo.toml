[package]
name = "sp1-host"
description = "Host side of the SP1 segment guest: builds it and runs it in the SP1 executor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Cycle-tracker regions need sp1-sdk's profiling executor, which is slower; only the stwo-bench test
# and the unit-costs command (docs/EVM-GAS-MODEL.md §6) turn it on, with the command's dependencies.
profiling = ["sp1-sdk/profiling", "dep:postcard", "dep:sha2", "dep:stwo"]

[[bin]]
name = "unit-costs"
path = "src/bin/unit_costs.rs"
required-features = ["profiling"]

[dependencies]
bincode.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.191"
postcard = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { version = "0.10.9", optional = true }
sp1-sdk.workspace = true
stwo = { workspace = true, optional = true }
tokio = { version = "1", features = ["sync"] }
zk-prover.workspace = true

[build-dependencies]
sp1-build.workspace = true

# The segment check's bundle mutations (`sash-segment-check/tests/common`), shared with its native tests.
[dev-dependencies]
sash-evm-primitives.workspace = true
sash-segment-check.workspace = true
sha2 = "0.10.9"
